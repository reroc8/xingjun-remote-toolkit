name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 检查批处理脚本
        run: python3 tests/check_bat.py

  smoke:
    name: Windows 冒烟测试
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 注意: 这一步的 PowerShell 里不要写中文。
      # GitHub Actions 会把 run: 的内容写成一个不带 BOM 的 .ps1,
      # Windows PowerShell 5.1 会按系统 ANSI 读它, 中文会直接搞坏解析。
      # 需要中文的提示都放在 tests/run-tests.ps1 里(那个文件带 BOM)。
      - name: 在真实 Windows 上运行脚本
        shell: powershell
        run: |
          $bats = @(Get-ChildItem -LiteralPath . -Filter *.bat | Sort-Object Name)
          Write-Host ("scripts under test: " + ($bats.Name -join ', '))
          $failed = @()
          foreach ($b in $bats) {
            Write-Host ("=" * 60)
            Write-Host ("  " + $b.Name)
            Write-Host ("=" * 60)
            powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -ScriptPath $b.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $b.Name }
          }
          if ($failed.Count -gt 0) { throw ("FAILED: " + ($failed -join ', ')) }
          Write-Host "ALL PASSED"
